services:
  # The app itself: nginx serving the static files on http://localhost:8080
  web:
    build: .
    image: trip-cost-calculator:local
    container_name: trip-cost-calculator
    ports:
      - "8080:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # Run the test suite without installing Node locally:
  #   docker compose run --rm test
  test:
    profiles: ["tools"]
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app:ro
    command: ["node", "--test", "test/calc.test.js"]
