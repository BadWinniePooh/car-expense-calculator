# Server block for the trip cost calculator.
#
# Listens on 8080 rather than 80 so the container can run as an unprivileged
# user — ports below 1024 need root.

server {
    # IPv4 only, deliberately: a container whose network namespace has no IPv6
    # cannot bind [::] and nginx would refuse to start. Docker publishes the
    # port over IPv4 regardless.
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # The app makes no network calls of its own and holds no user data, so the
    # policy can be strict: scripts only from here, stylesheets additionally
    # from Google Fonts, and no outbound connections at all.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_types        text/css application/javascript image/svg+xml application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache policy is set with `expires`, never `add_header`: a location that
    # declares its own add_header drops every header inherited from the server
    # block, which would quietly strip the security headers above.
    #
    # Filenames are not content-hashed, so the page itself must be revalidated
    # on every load; its assets may be held briefly.
    location = /index.html {
        expires -1;
    }

    location ~* \.(css|js|svg|woff2?)$ {
        expires 1h;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
